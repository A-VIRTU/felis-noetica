  cs: Pojmenován na počest sira Andrewa Wilese, britského matematika, který po více než 350 letech dokázal Velkou Fermatovu větu spojením teorie eliptických křivek a modulárních forem — čímž vyřešil nejslavnější a nejdelší otevřený problém v historii matematiky.
  en: Named in honour of Sir Andrew Wiles, British mathematician who proved Fermat's Last Theorem after more than three and a half centuries by linking elliptic curves and modular forms — resolving the most famous open problem in the history of mathematics.
