vyznam:
  cs: Pojmenována na počest Fanny Angeliny Hesseové, která navrhla využití agaru jako pevného živného média pro kultivaci mikroorganismů. Tento její nápad umožnil Robertu Kochovi a celé lékařské vědě izolovat čisté bakteriální kultury a položit tak základy moderní mikrobiologie.
  en: Named in honour of Fanny Angelina Hesse, who suggested using agar-agar as a solid medium for culturing microorganisms. Her innovation enabled Robert Koch and medical science to isolate pure bacterial cultures, laying the foundation for modern microbiology.
popis:
