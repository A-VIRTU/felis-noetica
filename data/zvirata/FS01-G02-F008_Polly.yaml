vyznam:
  cs: Pojmenována na počest americké imunoložky Polly Matzingerové, autorky revolučního modelu nebezpečí v imunologii. Její teorie proměnila chápání imunitního systému tím, že ukázala, že imunita nereaguje primárně na cizí látky, ale na signály poškození a tísně z vlastních tkání.
  en: Named in honour of American immunologist Polly Matzinger, creator of the revolutionary Danger Model in immunology. Her theory transformed immune science by demonstrating that immunity responds not to non-self, but to danger signals emitted by damaged tissues.
