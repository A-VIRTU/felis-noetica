    cs: Pojmenován 8. srpna 2026 při příležitosti 95. narozenin sira Rogera Penrose OM FRS, na počest jeho objevu, že vznik černých děr je robustní předpovědí obecné teorie relativity (Nobelova cena za fyziku 2020), věta o singularitách, které nesou jeho jméno, a jeho průkopnické práce na Penroseově dláždění a teorii twistorů.
    en: Named on 8 August 2026 on the occasion of Sir Roger Penrose OM FRS turning ninety-five, in honour of his discovery that black hole formation is a robust prediction of the general theory of relativity (Nobel Prize in Physics 2020), of the singularity theorems that bear his name, and of his pioneering work on Penrose tilings and twistor theory.
