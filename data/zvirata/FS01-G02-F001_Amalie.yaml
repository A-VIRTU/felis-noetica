  cs: Amalie Emmy Noetherová — teorém spojující symetrie a zákony zachování
  en: Amalie Emmy Noether — theorem linking symmetries and conservation laws
vyznam:
  cs: Pojmenována na počest německé matematičky Amalie Emmy Noetherové, jejíž průlomový teorém odhalil hlubokou a nedílnou souvislost mezi symetriemi fyzikálních zákonů a zákony zachování energie, hybnosti a elektrického náboje — čímž položila jeden z nejvýznamnějších základů moderní teoretické fyziky.
  en: Named in honour of German mathematician Amalie Emmy Noether, whose breakthrough theorem revealed the fundamental connection between physical symmetries and conservation laws of energy and momentum — establishing one of the cornerstone foundations of modern theoretical physics.
popis:
  cs: Tříbarevná (trikolóra) kočička s bílou náprsenkou ze Sibylina vrhu.
  en: A tricolour (calico) female kitten from Sibyla's litter.
