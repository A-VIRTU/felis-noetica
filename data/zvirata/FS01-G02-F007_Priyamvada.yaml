vyznam:
  cs: Pojmenována na počest prof. Priyamvady Natarajanové, profesorky astrofyziky a fyziky na Yaleově univerzitě, za její průkopnickou práci v mapování temné hmoty a temné energie prostřednictvím gravitačního čočkování galaktických kup a výzkum supermasivních černých děr v raném vesmíru.
  en: Named in honour of Prof. Priyamvada Natarajan, professor of astrophysics at Yale University, for her pioneering mapping of dark matter and dark energy using gravitational lensing by galaxy clusters and her work on supermassive black holes in the early universe.
