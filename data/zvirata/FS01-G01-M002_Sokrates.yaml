id: FS01-G01-M002
formalni_jmeno: Sokrates of Felis Noetica
jmeno: Sokrates
pohlavi: M
vrh: V2025-Sipka
stav: kastrovano
role: zůstává doma, mimo chov
genotyp: O/Y s/s
verejne: true
pojmenovan_po:
  cs: Sokrates — zakladatel západní filozofie
  en: Socrates — founder of Western philosophy
vyznam:
  cs: Pojmenován na počest starořeckého filozofa Sokrata, zakladatele západního filozofického uvažování a sokratovské metody kladením otázek — věnoval celý svůj život hledání pravdy, poctivosti mysli a sebepoznání.
  en: Named in honour of the classical Greek philosopher Socrates, founder of Western philosophy and the Socratic method of questioning — dedicating his life to truth, intellectual honesty, and self-knowledge.
zbarveni:
  cs: Rezavý
  en: Red (ginger)
popis:
  cs: Největší z vrhu od prvního dne. Nechá se nosit, což u koček nebývá.
  en: The largest of the litter from day one. He lets himself be carried, which cats usually do not.
