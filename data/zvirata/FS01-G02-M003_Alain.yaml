  vyznam:
    cs: Jméno odkazuje na prof. Alaina Aspecta, francouzského fyzika, laureáta Nobelovy ceny za fyziku 2022, za experimenty s provázanými fotony dokazující porušení Bellových nerovností — čímž měřením rozhodl to, o čem Einstein mohl jen pochybovat — a za průkopnickou práci v kvantové informační vědě.
    en: Named in honour of Prof. Alain Aspect, French physicist and Nobel laureate in Physics (2022), for experiments with entangled photons establishing the violation of Bell inequalities — settling by measurement what Einstein could only doubt — and for pioneering quantum information science.
    fr: Nommé en l'honneur d'Alain Aspect, physicien français, prix Nobel de physique 2022, pour ses expériences sur les photons intriqués établissant la violation des inégalités de Bell — tranchant par la mesure ce dont Einstein ne pouvait que douter — et pour son rôle de pionnier dans la science de l'information quantique.
