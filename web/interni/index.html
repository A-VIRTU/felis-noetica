<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Felis Noetica — interní přehled</title>
<style>
:root{--papir:#F7F6F3;--tmavsi:#EEECE6;--text:#2E2B27;--tichy:#6F6A61;--trava:#8C8556;--linka:#DED9D0}
*{box-sizing:border-box}
body{margin:0;background:var(--papir);color:var(--text);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{padding:1.1rem 1.4rem;border-bottom:1px solid var(--linka);display:flex;gap:1.2rem;align-items:baseline;flex-wrap:wrap;position:sticky;top:0;background:var(--papir);z-index:5}
h1{font-size:1rem;letter-spacing:.16em;text-transform:uppercase;color:var(--trava);margin:0;font-weight:600}
nav button{background:none;border:none;font:inherit;color:var(--tichy);cursor:pointer;padding:.2rem 0;border-bottom:2px solid transparent}
nav button.on{color:var(--text);border-bottom-color:var(--trava)}
nav{display:flex;gap:1.1rem}
.stat{margin-left:auto;color:var(--tichy);font-size:.85rem}
main{padding:1.2rem 1.4rem 4rem}
.filtry{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1.1rem;align-items:center}
input[type=search],select{font:inherit;padding:.4rem .6rem;border:1px solid var(--linka);border-radius:3px;background:#fff}
input[type=search]{min-width:16rem}
.chip{border:1px solid var(--linka);background:#fff;border-radius:99px;padding:.18rem .7rem;font-size:.82rem;cursor:pointer;color:var(--tichy)}
.chip.on{background:var(--trava);border-color:var(--trava);color:#fff}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th{text-align:left;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--tichy);border-bottom:1px solid var(--linka);padding:.5rem .6rem;position:sticky;top:57px;background:var(--papir);cursor:pointer;user-select:none}
td{padding:.5rem .6rem;border-bottom:1px solid var(--linka);vertical-align:top}
tr:hover td{background:var(--tmavsi)}
code{font-size:.82em;color:var(--tichy);word-break:break-all}
a{color:var(--text)}
.mrizka{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:.9rem}
.karta{border:1px solid var(--linka);background:#fff;border-radius:4px;overflow:hidden;display:flex;flex-direction:column}
.karta .nahled{aspect-ratio:4/3;background:var(--tmavsi);display:flex;align-items:center;justify-content:center;overflow:hidden}
.karta .nahled img{width:100%;height:100%;object-fit:cover;display:block}
.karta .nahled span{font-size:.7rem;letter-spacing:.1em;color:var(--tichy);text-transform:uppercase}
.karta .telo{padding:.5rem .6rem;font-size:.78rem}
.karta .telo b{display:block;font-weight:600;font-size:.8rem;margin-bottom:.15rem}
.karta .telo .kdo{color:var(--trava)}
.karta .telo .cs{color:var(--tichy);margin-top:.25rem}
.znacka{display:inline-block;font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;padding:.08rem .4rem;border-radius:3px;border:1px solid var(--linka);color:var(--tichy)}
.znacka.sukr{border-color:#B08A4F;color:#8a6a34}
.prazdno{color:var(--tichy);padding:2rem 0}
</style>
</head>
<body>
<header>
  <h1>Felis Noetica</h1>
  <nav>
    <button data-pohled="assety" class="on">Assety</button>
    <button data-pohled="zvirata">Zvířata</button>
    <button data-pohled="vrhy">Vrhy</button>
  </nav>
  <span class="stat" id="stat"></span>
</header>
<main>
  <div class="filtry" id="filtry"></div>
  <div id="obsah"></div>
</main>
<script>
let D = null, pohled = 'assety';
const st = { hledani:'', zvire:'', typ:'', rok:'', tagy:new Set(), verejnost:'', razeni:{klic:'datum', smer:-1} };

const el = (h) => { const d=document.createElement('div'); d.innerHTML=h.trim(); return d.firstChild; };
const esc = (s) => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const jmeno = (id) => (D.zvirata.find(z=>z.id===id)||{}).jmeno || id;

fetch('data.json').then(r=>r.json()).then(d=>{ D=d; kresli(); });

document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); pohled=b.dataset.pohled; kresli();
});

function filtrovaneAssety(){
  const h = st.hledani.toLowerCase();
  return D.assety.filter(a=>{
    if(st.zvire && !(a.zvirata||[]).includes(st.zvire)) return false;
    if(st.typ && a.typ!==st.typ) return false;
    if(st.rok && !(a.datum||'').startsWith(st.rok)) return false;
    if(st.verejnost==='ver' && !a.verejne) return false;
    if(st.verejnost==='sukr' && a.verejne) return false;
    for(const t of st.tagy) if(!(a.tagy||[]).includes(t)) return false;
    if(h){
      const kupa = [a.soubor,a.misto,(a.tagy||[]).join(' '),(a.zvirata||[]).map(jmeno).join(' '),
        Object.values(a.popisky||{}).map(p=>[p.navesti,p.text].join(' ')).join(' ')].join(' ').toLowerCase();
      if(!kupa.includes(h)) return false;
    }
    return true;
  }).sort((x,y)=>String(y.datum||'').localeCompare(String(x.datum||'')));
}

function kresliFiltry(){
  const f = document.getElementById('filtry'); f.innerHTML='';
  if(pohled!=='assety'){ f.appendChild(el(`<input type="search" placeholder="hledat…">`)); f.firstChild.value=st.hledani;
    f.firstChild.oninput=e=>{st.hledani=e.target.value;kresliObsah();}; return; }

  const roky = [...new Set(D.assety.map(a=>(a.datum||'').slice(0,4)).filter(Boolean))].sort().reverse();
  f.appendChild(el(`<input type="search" placeholder="hledat v popiscích, jménech, tazích…">`));
  f.firstChild.value = st.hledani;
  f.firstChild.oninput = e=>{ st.hledani=e.target.value; kresliObsah(); };

  const sel = (id,popis,moznosti,hodnota) => {
    const s = el(`<select><option value="">${popis}</option>${moznosti.map(m=>`<option value="${esc(m[0])}">${esc(m[1])}</option>`).join('')}</select>`);
    s.value = hodnota; s.onchange = e=>{ st[id]=e.target.value; kresliObsah(); }; return s;
  };
  f.appendChild(sel('zvire','všechna zvířata', D.zvirata.map(z=>[z.id,`${z.id}  ${z.jmeno}`]), st.zvire));
  f.appendChild(sel('typ','všechny typy', [['foto','foto'],['video','video'],['dokument','dokument']], st.typ));
  f.appendChild(sel('rok','všechny roky', roky.map(r=>[r,r]), st.rok));
  f.appendChild(sel('verejnost','veřejné i soukromé', [['ver','jen veřejné'],['sukr','jen soukromé']], st.verejnost));
  for(const t of D.tagy){
    const c = el(`<span class="chip${st.tagy.has(t)?' on':''}">${esc(t)}</span>`);
    c.onclick=()=>{ st.tagy.has(t)?st.tagy.delete(t):st.tagy.add(t); kresli(); };
    f.appendChild(c);
  }
}

function kartaAssetu(a){
  const p = a.popisky?.cs || a.popisky?.en || {};
  const nahled = a.typ==='foto'
    ? `<img src="${esc(a.url)}" alt="" loading="lazy">`
    : `<span>${a.typ}</span>`;
  return `<div class="karta">
    <a class="nahled" href="${esc(a.url)}" target="_blank" rel="noopener">${nahled}</a>
    <div class="telo">
      <b>${esc(a.soubor.split('/').pop())}</b>
      <span class="znacka${a.verejne?'':' sukr'}">${a.verejne?'veřejné':'soukromé'}</span>
      ${a.datum?` <span style="color:var(--tichy)">${esc(a.datum)}</span>`:''}
      ${a.zvirata.length?`<div class="kdo">${a.zvirata.map(i=>`${i} ${jmeno(i)}`).map(esc).join(', ')}</div>`:''}
      ${p.text?`<div class="cs">${esc(p.text)}</div>`:''}
      ${a.tagy.length?`<div class="cs">#${a.tagy.map(esc).join(' #')}</div>`:''}
      <div class="cs"><code>${esc(a.zdroj)}</code></div>
    </div>
  </div>`;
}

function kresliObsah(){
  const o = document.getElementById('obsah');
  if(pohled==='assety'){
    const s = filtrovaneAssety();
    document.getElementById('stat').textContent = `${s.length} z ${D.assety.length} assetů`;
    o.innerHTML = s.length ? `<div class="mrizka">${s.map(kartaAssetu).join('')}</div>` : `<p class="prazdno">Nic neodpovídá filtru.</p>`;
    return;
  }
  if(pohled==='zvirata'){
    const h = st.hledani.toLowerCase();
    const s = D.zvirata.filter(z=>!h||[z.jmeno,z.id,z.uuid,z.stav].join(' ').toLowerCase().includes(h));
    document.getElementById('stat').textContent = `${s.length} zvířat`;
    o.innerHTML = `<table><thead><tr>
      <th>jméno</th><th>id</th><th>gen.</th><th>narozeno</th><th>stav</th><th>rodiče</th><th>assetů</th><th>soukromá stránka</th></tr></thead><tbody>
      ${s.map(z=>`<tr>
        <td><b>${esc(z.jmeno)}</b></td>
        <td><code>${esc(z.id)}</code></td>
        <td>${z.generace}</td>
        <td>${esc(z.narozeni||'—')}</td>
        <td>${esc(z.stav)}</td>
        <td>${[z.matka,z.otec].filter(Boolean).map(jmeno).map(esc).join(' × ')||'—'}</td>
        <td>${z.pocet_assetu}</td>
        <td>${z.stranka?`<a href="${esc(z.stranka)}" target="_blank" rel="noopener">otevřít</a><br><code>${esc(z.uuid)}</code>`:'—'}</td>
      </tr>`).join('')}</tbody></table>`;
    return;
  }
  const s = D.vrhy;
  document.getElementById('stat').textContent = `${s.length} vrhů`;
  o.innerHTML = `<table><thead><tr><th>vrh</th><th>matka</th><th>otec</th><th>narozeno</th><th>počet</th><th>veřejný</th></tr></thead><tbody>
    ${s.map(v=>`<tr><td><code>${esc(v.id)}</code></td><td>${esc(jmeno(v.matka))}</td><td>${v.otec?esc(jmeno(v.otec)):'—'}</td>
    <td>${esc(v.narozeni)}</td><td>${v.pocet??'—'}</td><td>${v.verejne?'ano':'ne'}</td></tr>`).join('')}</tbody></table>`;
}

function kresli(){ kresliFiltry(); kresliObsah(); }
</script>
</body>
</html>
